name: Deploy Sappun to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test private access and password sharing
        run: |
          node tests/cloud-api.test.mjs
          node tests/cloud-client.test.mjs
          node tests/map-share-links.test.cjs
      - name: Prepare app files
        run: node scripts/build-pages.mjs
      - name: Check public files for private data and credentials
        run: node scripts/audit-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
