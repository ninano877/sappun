name: Deploy Sappun private API
on:
  push:
    branches: [main, master]
    paths: ['server/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sappun-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test access control and sharing
        run: |
          node tests/cloud-api.test.mjs
          node tests/cloud-client.test.mjs
      - name: Apply database schema
        run: npx wrangler@4 d1 execute sappun --remote --file server/schema.sql --config server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API
        run: npx wrangler@4 deploy --config server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
